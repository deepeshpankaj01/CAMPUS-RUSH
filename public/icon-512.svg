<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="45%" stop-color="#1B1745"/>
      <stop offset="100%" stop-color="#29245E"/>
    </linearGradient>
    <linearGradient id="grad-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#41E5F5"/>
      <stop offset="50%" stop-color="#7865FF"/>
      <stop offset="100%" stop-color="#FF5C7A"/>
    </linearGradient>
    <linearGradient id="spark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB547"/>
      <stop offset="100%" stop-color="#FF5C7A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#41E5F5" stroke-width="6" stroke-opacity="0.35"/>
  
  <!-- Circuit grid lines -->
  <path d="M64 160 H200 L240 200 H448" stroke="#7865FF" stroke-width="4" stroke-opacity="0.25" fill="none"/>
  <path d="M64 352 H200 L240 312 H448" stroke="#41E5F5" stroke-width="4" stroke-opacity="0.25" fill="none"/>
  
  <!-- Stylized Running "D" Monogram -->
  <path d="M140 110 H260 C340 110 390 170 390 256 C390 342 340 402 260 402 H140 Z" fill="none" stroke="url(#grad-accent)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Dynamic Speed Arrow & Spark -->
  <path d="M210 200 L300 256 L210 312 Z" fill="url(#spark-grad)"/>
  <circle cx="380" cy="150" r="22" fill="#FFB547" filter="url(#glow)"/>
  
  <!-- Speed trail lines -->
  <line x1="80" y1="210" x2="115" y2="210" stroke="#41E5F5" stroke-width="14" stroke-linecap="round"/>
  <line x1="60" y1="256" x2="105" y2="256" stroke="#FF5C7A" stroke-width="14" stroke-linecap="round"/>
  <line x1="75" y1="302" x2="115" y2="302" stroke="#41E5F5" stroke-width="14" stroke-linecap="round"/>
</svg>
