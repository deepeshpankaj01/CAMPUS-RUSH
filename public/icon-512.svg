<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#2E1065"/>
    </linearGradient>
    <linearGradient id="grad-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <linearGradient id="spark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#38BDF8" stroke-width="6" stroke-opacity="0.35"/>
  
  <!-- Speed runner chevrons -->
  <path d="M125 380 L195 132 L315 132 L245 380 Z" fill="url(#grad-accent)" filter="url(#glow)"/>
  <path d="M265 380 L335 132 L405 132 L335 380 Z" fill="url(#spark-grad)"/>
  <circle cx="390" cy="110" r="28" fill="#FDE047" filter="url(#glow)"/>
  
  <!-- Speed trail lines -->
  <line x1="68" y1="210" x2="115" y2="210" stroke="#38BDF8" stroke-width="14" stroke-linecap="round"/>
  <line x1="48" y1="256" x2="100" y2="256" stroke="#F43F5E" stroke-width="14" stroke-linecap="round"/>
  <line x1="64" y1="302" x2="115" y2="302" stroke="#38BDF8" stroke-width="14" stroke-linecap="round"/>
</svg>
