<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#2E1065"/>
    </linearGradient>
    <linearGradient id="runnerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background Rounded Shield -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="24" fill="none" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.45"/>
  
  <!-- Stylized Campus Rush Dynamic Motion Chevrons -->
  <path d="M32 94 L50 34 L80 34 L62 94 Z" fill="url(#runnerGrad)" filter="url(#glow)"/>
  <path d="M66 94 L84 34 L102 34 L84 94 Z" fill="url(#sparkGrad)"/>
  
  <circle cx="94" cy="28" r="7" fill="#FDE047" filter="url(#glow)"/>
  <line x1="18" y1="52" x2="28" y2="52" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
  <line x1="12" y1="64" x2="26" y2="64" stroke="#F43F5E" stroke-width="4" stroke-linecap="round"/>
  <line x1="16" y1="76" x2="28" y2="76" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
</svg>
