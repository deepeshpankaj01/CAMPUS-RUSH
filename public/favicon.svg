<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="50%" stop-color="#29245E"/>
      <stop offset="100%" stop-color="#7865FF"/>
    </linearGradient>
    <linearGradient id="spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#41E5F5"/>
      <stop offset="100%" stop-color="#FFB547"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background Rounded Shield -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="24" fill="none" stroke="#41E5F5" stroke-width="2" stroke-opacity="0.4"/>
  
  <!-- Stylized D Runner Symbol -->
  <path d="M36 28 H66 C84 28 96 42 96 64 C96 86 84 100 66 100 H36 Z" fill="none" stroke="#41E5F5" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Speed Lines & Idea Spark -->
  <path d="M52 48 L76 64 L52 80 Z" fill="url(#spark)"/>
  <circle cx="94" cy="38" r="6" fill="#FFB547" filter="url(#glow)"/>
  <line x1="22" y1="52" x2="30" y2="52" stroke="#41E5F5" stroke-width="4" stroke-linecap="round"/>
  <line x1="16" y1="64" x2="28" y2="64" stroke="#FF5C7A" stroke-width="4" stroke-linecap="round"/>
  <line x1="20" y1="76" x2="30" y2="76" stroke="#41E5F5" stroke-width="4" stroke-linecap="round"/>
</svg>
